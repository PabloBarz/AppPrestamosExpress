<div class="page-header">
  <div>
    <h1 class="page-title">Tipos de Herramienta</h1>
    <p class="page-subtitle">Gestiona las categorias de herramientas</p>
  </div>
  <button class="btn-primary-action" id="btnNuevoTipoHerramienta">
    <i class="bi bi-plus-lg"></i> Nuevo Tipo
  </button>
</div>

<div class="search-bar-row">
  <div class="search-input-wrap">
    <i class="bi bi-search search-icon"></i>
    <input type="text" id="searchTipoHerramienta" class="search-input" placeholder="Buscar tipo..." />
  </div>
  <button class="btn-icon-outline" id="btnRefreshTiposHerramienta" title="Recargar">
    <i class="bi bi-arrow-clockwise"></i>
  </button>
</div>

<div class="card-panel">
  <div class="table-responsive">
    <table class="table-custom">
      <thead>
        <tr>
          <th>#</th>
          <th>Tipo</th>
          <th>Categoría</th>
          <th>Descripcion</th>
          <th>Modelos</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="bodyTiposHerramienta">
        <tr><td colspan="5" class="text-center py-5"><div class="spinner-custom"></div></td></tr>
      </tbody>
    </table>
  </div>
  <div class="table-footer">
    <span class="text-muted text-sm" id="totalTiposHerramientaLabel">Cargando...</span>
  </div>
</div>

<div class="modal-overlay" id="modalTipoHerramientaOverlay">
  <div class="modal-panel modal-sm">
    <div class="modal-header-custom">
      <div>
        <div class="modal-title-custom" id="modalTipoHerramientaTitle">Nuevo Tipo</div>
        <div class="modal-subtitle">Ingresa los datos del tipo de herramienta</div>
      </div>
      <button class="btn-modal-close" id="btnCloseModalTipoHerramienta"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="modal-body-custom">
      <form id="formTipoHerramienta" novalidate>
        <input type="hidden" id="tipoHerramientaId" />

        <label class="form-label-custom">Categoría <span class="required">*</span></label>
        <select id="thCategoria" class="input-custom"></select>
        <div class="field-error" id="err-thCategoria"></div>

        <label class="form-label-custom">Tipo <span class="required">*</span></label>
        <input type="text" id="thTipo" class="input-custom" placeholder="Ej: Electrica" maxlength="50" required />
        <div class="field-error" id="err-thTipo"></div>

        <label class="form-label-custom mt-3">Descripcion</label>
        <input type="text" id="thDescripcion" class="input-custom" placeholder="Ej: Herramientas con motor electrico" maxlength="150" />
      </form>
    </div>
    <div class="modal-footer-custom">
      <button class="btn-cancel" id="btnCancelTipoHerramienta">Cancelar</button>
      <button class="btn-save" id="btnSaveTipoHerramienta">
        <span id="btnSaveTipoHerramientaText"><i class="bi bi-check-lg me-1"></i> Guardar</span>
        <span id="btnSaveTipoHerramientaSpinner" class="d-none"><div class="spinner-sm"></div></span>
      </button>
    </div>
  </div>
</div>
