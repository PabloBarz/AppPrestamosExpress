<div class="page-header">
  <div>
    <h1 class="page-title">Préstamos</h1>
    <p class="page-subtitle">Gestión de préstamos de herramientas</p>
  </div>

  <button class="btn-primary-action" id="btnNuevoPrestamo">
    <i class="bi bi-plus-lg"></i> Nuevo Préstamo
  </button>
</div>

<div class="search-bar-row">
  <button class="btn-icon-outline" id="btnRefreshPrestamos">
    <i class="bi bi-arrow-clockwise"></i>
  </button>
</div>

<div class="card-panel">
  <div class="table-responsive ">
    <table class="table-custom ">
      <thead>
        <tr>
          <th>#</th>
          <th>Colaborador</th>
          <th>Fecha</th>
          <th>Total</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="bodyPrestamos"></tbody>
    </table>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalPrestamoOverlay">
  <div class="modal-panel">

    <div class="modal-header-custom">
      <div class="modal-title-custom">Nuevo Préstamo</div>
      <button id="btnClosePrestamo">✖</button>
    </div>

    <div class="modal-body-custom">
      <label>Colaborador</label>
      <select id="pColaborador" class="input-custom"></select>

      <label class="mt-2">Herramientas</label>
      <select id="pHerramientas" multiple class="input-custom"></select>

      <label class="mt-2">Observación</label>
      <input id="pObservacion" class="input-custom">
    </div>

    <div class="modal-footer-custom">
      <button class="btn-cancel" id="btnCancelPrestamo">Cancelar</button>
      <button class="btn-save" id="btnSavePrestamo">Guardar</button>
    </div>

  </div>
</div>

<!-- MODAL DETALLE PRÉSTAMO -->
<div class="modal-overlay" id="modalDetallePrestamo">
  <div class="modal-panel">

    <div class="modal-header-custom">
      <div>
        <div class="modal-title-custom">Detalle de Préstamo</div>
        <div class="modal-subtitle">Herramientas prestadas</div>
      </div>
      <button class="btn-modal-close" onclick="closeOverlay('modalDetallePrestamo')">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="modal-body-custom">
      <div class="table-responsive">
        <table class="table-custom">
          <thead>
            <tr>
              <th>Código</th>
              <th>Hora préstamo</th>
              <th>Hora esperada</th>
              <th>Hora devolución</th>
              <th>Estado</th>
              <th>Condición</th>
              <th>Acción</th>
            </tr>
          </thead>

          <tbody id="detallePrestamoBody">
            <tr>
              <td colspan="7" class="text-center py-5">
                <div class="spinner-custom"></div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<!-- MODAL DEVOLVER -->
<div class="modal-overlay" id="modalDevolver">
  <div class="modal-panel modal-sm">

    <div class="modal-header-custom">
      <div class="modal-title-custom">Devolver Herramienta</div>
    </div>

    <div class="modal-body-custom">

      <input type="hidden" id="devolverDetalleId">

      <label>Estado de la herramienta</label>
      <select id="estadoDevolucion" class="input-custom">
        <option value="Bueno">Bueno</option>
        <option value="Regular">Regular</option>
        <option value="Danado">Dañado</option>
        <option value="Incompleto">Incompleto</option>
      </select>

      <label class="mt-2">Observaciones</label>
      <textarea id="obsDevolucion" class="input-custom"></textarea>

    </div>

    <div class="modal-footer-custom">
      <button class="btn-cancel" onclick="closeOverlay('modalDevolver')">Cancelar</button>
      <button class="btn-save" id="btnConfirmDevolucion">Confirmar</button>
    </div>

  </div>
</div>
