<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Productos</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- ══════════════════════════════════════════
       SIDEBAR  (estructura fija, nunca cambia)
  ══════════════════════════════════════════ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon"><i class="bi bi-box-seam-fill"></i></div>
        <div>
          <div class="brand-name">App Prestamo</div>
          <div class="brand-sub">Panel de gestión</div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">Principal</div>
        <a href="#" class="nav-item active" data-page="dashboard">
          <i class="bi bi-grid-1x2-fill"></i>
          <span>Dashboard</span>
        </a>
        <a href="#" class="nav-item" data-page="marcas">
          <i class="bi bi-bookmark-star"></i>
          <span>Marcas</span>
          <span class="nav-badge" id="badge-marcas">0</span>
        </a>
        <a href="#" class="nav-item" data-page="tipoHerramientas">
          <i class="bi bi-tools"></i>
          <span>Tipos</span>
          <span class="nav-badge" id="badge-tipos-herramienta">0</span>
        </a>
      </nav>

      <div class="sidebar-footer" id="userMenuWrapper">
        <div class="user-menu-trigger" id="userMenuBtn">
          <div class="d-flex align-items-center gap-2">
            <div class="avatar-xs"><i class="bi bi-person-fill"></i></div>
            <div>
              <div class="fw-600 text-sm">Administrador</div>
              <div class="text-muted" style="font-size: 11px">Sistema v1.0</div>
            </div>
          </div>
        </div>

        <div class="user-dropdown" id="userDropdown">
          <button class="dropdown-item">
            <i class="bi bi-person me-2"></i> Ver perfil
          </button>

          <button class="dropdown-item">
            <i class="bi bi-key me-2"></i> Cambiar contraseña
          </button>

          <hr style="margin: 5px 0" />

          <button class="dropdown-item text-danger" id="btnLogout">
            <i class="bi bi-box-arrow-right me-2"></i> Cerrar sesión
          </button>
        </div>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ══════════════════════════════════════════
       MAIN CONTENT
  ══════════════════════════════════════════ -->
    <main class="main-content" id="mainContent">
      <header class="topbar">
        <button class="btn-toggle-sidebar" id="btnToggleSidebar">
          <i class="bi bi-list"></i>
        </button>
        <div class="topbar-title" id="topbarTitle">Dashboard</div>
        <div class="topbar-actions">
          <div class="status-dot"></div>
          <span class="text-sm text-muted">Conectado</span>
        </div>
      </header>

      <!-- ════════════════════════════════════════
         CONTENEDOR DINÁMICO
         El router inyecta aquí el HTML de cada vista
    ════════════════════════════════════════ -->
      <div class="page-wrapper" id="pageContainer">
        <div
          class="d-flex justify-content-center align-items-center"
          style="height: 60vh"
        >
          <div class="spinner-custom"></div>
        </div>
      </div>
    </main>

    <!-- ══════════════════════════════════════════
       MODALES GLOBALES (compartidos entre módulos)
  ══════════════════════════════════════════ -->
    <div id="modalsContainer"></div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Orden de carga: utilidades → router → módulos → arranque -->
    <script src="js/utils.js"></script>
    <script src="js/router.js"></script>
    <script src="js/modules/dashboard.js"></script>
    <script src="js/modules/marcas.js"></script>
    <script src="js/modules/tipo-herramientas.js"></script>
    <script src="js/modules/modelos.js"></script>
    <script src="js/modules/login.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
